[build]
  command = "npm run build"
  publish = "dist"

# SPA: qualquer rota (ex: /dashboard, /clients/123) tem de devolver o
# index.html — é o React Router que decide o que mostrar no browser.
# Sem isto, um refresh directo em qualquer página que não seja "/" dá 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
